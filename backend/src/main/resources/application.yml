spring:
  application:
    name: vectramoment-backend
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: vectramoment
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8080

vectramoment:
  kafka:
    video-ingested-topic: video.ingested
  storage:
    mode: local
    local-dir: ${VECTRAMOMENT_STORAGE_LOCAL_DIR:${user.dir}/target/vectramoment-uploads}
  opensearch:
    endpoint: ${OPENSEARCH_ENDPOINT:http://localhost:9200}
